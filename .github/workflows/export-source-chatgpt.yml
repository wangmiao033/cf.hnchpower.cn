name: Export source for ChatGPT deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source-chatgpt.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Archive tracked source
        run: git archive --format=zip HEAD -o /tmp/cf-source.zip

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: cf-source-main
          path: /tmp/cf-source.zip
          retention-days: 1
