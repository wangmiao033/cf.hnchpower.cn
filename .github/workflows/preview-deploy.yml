name: Preview Deploy

on:
  push:
    branches:
      - codex/inline-reconciliation-actions-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-hnchpower-preview-inline-actions
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_YfsD5pM9JFtkqXnJIUdbF2eI
  VERCEL_PROJECT_ID: prj_eMuMpXX2hUKvy7lSQ1deDIzoQDRN

jobs:
  deploy-preview:
    name: Deploy Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Confirm Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Deploy branch to Vercel Preview
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_FILE="$(mktemp)"
          npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN" 2>&1 | tee "$OUTPUT_FILE"
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$OUTPUT_FILE" | tail -n 1 || true)"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Could not determine Preview deployment URL"
            exit 1
          fi
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Preview summary
        run: |
          {
            echo '### Vercel Preview'
            echo '- Branch: `codex/inline-reconciliation-actions-v2`'
            echo '- Git SHA: `${{ github.sha }}`'
            echo '- Preview URL: `${{ steps.vercel.outputs.url }}`'
            echo '- Production domain is unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
