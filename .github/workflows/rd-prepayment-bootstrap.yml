name: R&D Prepayment Upgrade Bootstrap

on:
  push:
    branches:
      - feature/rd-prepayment-deduction-20260815

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            contract_terms/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r contract_terms/requirements.txt

      - name: Apply upgrade
        run: python scripts/apply_rd_prepayment_upgrade.py

      - name: Compile and run targeted Python tests
        env:
          PYTHONPATH: backend:contract_terms:.
        run: |
          python -m compileall -q backend/app backend/tests contract_terms
          python -m unittest backend.tests.test_rd_prepayment -v
          python -m unittest contract_terms.test_rd_prepayment_recommender -v
          python -m unittest contract_terms.test_rd_rule_recommender -v

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frontend tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit upgraded sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_rd_prepayment_upgrade.py .github/workflows/rd-prepayment-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add R&D prepayment deduction flow'
          git push origin HEAD
