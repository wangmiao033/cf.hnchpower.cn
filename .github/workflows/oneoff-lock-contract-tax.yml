name: One-off lock contract tax rate

on:
  push:
    branches:
      - fix/lock-contract-tax-rate-20260824

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lock-contract-tax-rate-20260824
          fetch-depth: 0
      - name: Make share and tax contract-owned fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/channel/ChannelBillingForm.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.shareRate} onChange={(e) => handleLineChange(index, 'shareRate', e.target.value)} placeholder="合同带入/人工填写" /></td>''',
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.shareRate} readOnly aria-label="合同分成比例" placeholder="合同带入/补清单" /></td>''',
                  'share input',
              ),
              (
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.taxRate} onChange={(e) => handleLineChange(index, 'taxRate', e.target.value)} placeholder="合同带入/填0" /></td>''',
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.taxRate} readOnly aria-label="合同税率" placeholder="合同带入/补清单" /></td>''',
                  'tax input',
              ),
              (
                  '''if (mode === 'add' && !targetedRuleLocked && String(row.shareRate ?? '').trim() === '') { const msg = `第 ${i + 1} 行：分成比例尚未由合同确定，请等待合同匹配或人工填写`; onError?.(msg) ?? window.alert(msg); return }''',
                  '''if (mode === 'add' && !targetedRuleLocked && String(row.shareRate ?? '').trim() === '') { const msg = `第 ${i + 1} 行：分成比例尚未由合同确定，请先补合作清单或重新匹配合同`; onError?.(msg) ?? window.alert(msg); return }''',
                  'share validation copy',
              ),
              (
                  '''if (mode === 'add' && !targetedRuleLocked && String(row.taxRate ?? '').trim() === '') { const msg = `第 ${i + 1} 行：税率尚未由合同确定，请等待合同匹配或人工填写 0`; onError?.(msg) ?? window.alert(msg); return }''',
                  '''if (mode === 'add' && !targetedRuleLocked && String(row.taxRate ?? '').trim() === '') { const msg = `第 ${i + 1} 行：税率尚未由合同确定，请先补合作清单或重新匹配合同`; onError?.(msg) ?? window.alert(msg); return }''',
                  'tax validation copy',
              ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/components/channel/ChannelSettlementRule.css')
          text = path.read_text(encoding='utf-8')
          old = '''/* 分成比例由合同合作清单决定：主表只展示合同值，不作为日常手工录入项。合同缺失时应走“补合作清单”流程。 */
.channel-line-items-table tbody td:nth-child(12) input.admin-input{pointer-events:none;caret-color:transparent;user-select:none;border-color:transparent!important;background:transparent!important;box-shadow:none!important;padding-left:0;padding-right:0;text-align:right;font-weight:800;color:#355e85;cursor:default}.channel-line-items-table tbody td:nth-child(12) input.admin-input::placeholder{color:transparent}'''
          new = '''/* 分成比例、税率都由合同合作清单决定：主表只展示合同值，不作为日常手工录入项。合同缺失时走“补合作清单”流程。 */
.channel-line-items-table tbody :is(td:nth-child(12),td:nth-child(13)) input.admin-input{pointer-events:none;caret-color:transparent;user-select:none;border-color:transparent!important;background:transparent!important;box-shadow:none!important;padding-left:0;padding-right:0;text-align:right;font-weight:800;color:#355e85;cursor:default}.channel-line-items-table tbody :is(td:nth-child(12),td:nth-child(13)) input.admin-input::placeholder{color:transparent}'''
          if old not in text:
              raise SystemExit('contract display CSS anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/components/channel/channelContractSafety.test.js')
          text = path.read_text(encoding='utf-8')
          anchor = '''  it('labels technical errors separately from business rule gaps', () => {'''
          addition = '''  it('treats share and tax as contract-owned read-only fields in the bill table', () => {
    expect(billingSource).toContain('readOnly aria-label="合同分成比例"')
    expect(billingSource).toContain('readOnly aria-label="合同税率"')
    expect(billingSource).toContain('分成比例尚未由合同确定，请先补合作清单或重新匹配合同')
    expect(billingSource).toContain('税率尚未由合同确定，请先补合作清单或重新匹配合同')
    expect(billingSource).not.toContain('placeholder="合同带入/填0"')
  })

'''
          if addition.strip() not in text:
              if anchor not in text:
                  raise SystemExit('test anchor not found')
              text = text.replace(anchor, addition + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/oneoff-lock-contract-tax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make channel tax rate contract-owned'
          git push origin HEAD:fix/lock-contract-tax-rate-20260824
