name: One-off enforce contract-owned rates

on:
  push:
    branches:
      - fix/enforce-contract-owned-rates-20260824

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enforce-contract-owned-rates-20260824
          fetch-depth: 0
      - name: Make share and tax truly read-only in bill detail table
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/channel/ChannelBillingForm.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.shareRate} onChange={(e) => handleLineChange(index, 'shareRate', e.target.value)} placeholder="合同带入/人工填写" /></td>''',
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.shareRate} readOnly aria-label="合同分成比例" placeholder="合同带入/补清单" /></td>''',
              ),
              (
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.taxRate} onChange={(e) => handleLineChange(index, 'taxRate', e.target.value)} placeholder="合同带入/填0" /></td>''',
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.taxRate} readOnly aria-label="合同税率" placeholder="合同带入/补清单" /></td>''',
              ),
              (
                  '''第 ${i + 1} 行：分成比例尚未由合同确定，请等待合同匹配或人工填写''',
                  '''第 ${i + 1} 行：分成比例尚未由合同确定，请先补合作清单或重新匹配合同''',
              ),
              (
                  '''第 ${i + 1} 行：税率尚未由合同确定，请等待合同匹配或人工填写 0''',
                  '''第 ${i + 1} 行：税率尚未由合同确定，请先补合作清单或重新匹配合同''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'anchor not found: {old[:48]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('src/components/channel/channelContractSafety.test.js')
          test = test_path.read_text(encoding='utf-8')
          anchor = '''  it('labels technical errors separately from business rule gaps', () => {'''
          addition = '''  it('prevents direct editing of contract-owned share and tax rates', () => {
    expect(billingSource).toContain('readOnly aria-label="合同分成比例"')
    expect(billingSource).toContain('readOnly aria-label="合同税率"')
    expect(billingSource).toContain('分成比例尚未由合同确定，请先补合作清单或重新匹配合同')
    expect(billingSource).toContain('税率尚未由合同确定，请先补合作清单或重新匹配合同')
  })

'''
          if addition.strip() not in test:
              if anchor not in test:
                  raise SystemExit('test anchor not found')
              test = test.replace(anchor, addition + anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          rm -f .github/workflows/oneoff-enforce-contract-owned-rates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce contract-owned share and tax rates'
          git push origin HEAD:fix/enforce-contract-owned-rates-20260824
