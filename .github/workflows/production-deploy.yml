name: Production Deploy

on:
  pull_request:
    paths:
      - '.github/workflows/production-deploy.yml'
      - 'vercel.json'
      - 'contract_ai/**'
      - 'contract_terms/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-hnchpower-production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_YfsD5pM9JFtkqXnJIUdbF2eI
  VERCEL_PROJECT_ID: prj_eMuMpXX2hUKvy7lSQ1deDIzoQDRN

jobs:
  vercel-token-preflight:
    name: Vercel and Cloudflare config preflight
    runs-on: ubuntu-latest
    steps:
      - name: Confirm VERCEL_TOKEN is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is not configured."
            exit 1
          fi
          echo "VERCEL_TOKEN is configured."

      - name: Confirm Cloudflare Workers AI Production variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT
          CODE="$(curl -sS -o "$ENV_FILE" -w '%{http_code}' \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          if [ "$CODE" != "200" ]; then
            echo "::error::Unable to read Vercel project environment variables (HTTP $CODE)."
            exit 1
          fi
          python - "$ENV_FILE" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          required = {'CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_WORKERS_AI_TOKEN'}
          found = set()

          def walk(value):
              if isinstance(value, dict):
                  key = value.get('key')
                  target = value.get('target')
                  if key in required:
                      if target is None or target == 'production' or (
                          isinstance(target, list) and 'production' in target
                      ):
                          found.add(key)
                  for item in value.values():
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)

          walk(payload)
          missing = sorted(required - found)
          if missing:
              print('::error::Missing Vercel Production variables: ' + ', '.join(missing))
              print('Create a Workers AI REST API token in Cloudflare, then add both variables before merging.')
              raise SystemExit(1)
          print('Cloudflare Workers AI Production variables are configured.')
          PY

  contract-ai-preflight:
    name: Contract AI dependency and structured-output tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: contract_ai/requirements.txt
      - name: Install contract AI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r contract_ai/requirements.txt
          python -m pip check
      - name: Compile and import Cloudflare contract service
        run: |
          python -m compileall -q contract_ai
          python - <<'PY'
          import sys
          sys.path.insert(0, 'contract_ai')
          import cloudflare_main
          routes = [getattr(route, 'path', '') for route in cloudflare_main.app.router.routes]
          assert routes.count('/api/contracts/smart-scan') == 1, routes
          assert '/api/contracts/internal-numbers' in routes, routes
          print('Cloudflare contract service import OK.')
          PY
      - name: Run Cloudflare structured-output regression tests
        env:
          PYTHONPATH: contract_ai:.
        run: python -m unittest discover -s contract_ai -p 'test_*.py' -v

  frontend:
    name: Frontend tests and build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend + contract service tests and compile check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            contract_terms/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r contract_terms/requirements.txt
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests proxy contract_ai contract_terms
      - name: Run backend unit tests
        env:
          PYTHONPATH: backend:.
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: Run contract settlement regression tests
        env:
          PYTHONPATH: contract_terms:.
        run: python -m unittest discover -s contract_terms -p 'test_*.py' -v

  deploy:
    name: Single Vercel production deployment
    if: github.event_name != 'pull_request'
    needs:
      - vercel-token-preflight
      - contract-ai-preflight
      - frontend
      - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Skip stale main revisions
        id: latest
        shell: bash
        run: |
          git fetch origin main --depth=1
          LATEST_SHA="$(git rev-parse origin/main)"
          echo "Current workflow SHA: $GITHUB_SHA"
          echo "Latest main SHA:      $LATEST_SHA"
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main revision exists; this run will not create a Vercel deployment."
          fi

      - uses: actions/setup-node@v4
        if: steps.latest.outputs.deploy == 'true'
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        if: steps.latest.outputs.deploy == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration dependencies
        if: steps.latest.outputs.deploy == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Run serialized production database migrations
        if: steps.latest.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ENV_JSON="$(mktemp)"
          ENV_EXPORTS="$(mktemp)"
          trap 'rm -f "$ENV_JSON" "$ENV_EXPORTS"' EXIT

          CODE="$(curl -sS -o "$ENV_JSON" -w '%{http_code}' \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&decrypt=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          if [ "$CODE" != "200" ]; then
            echo "::error::Unable to read decrypted Vercel Production database variables (HTTP $CODE)."
            exit 1
          fi

          python - "$ENV_JSON" "$ENV_EXPORTS" <<'PY'
          import json
          import shlex
          import sys

          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          output_path = sys.argv[2]
          wanted = {'DATABASE_URL', 'QUICKSDK_DATABASE_URL'}
          found = {}

          def is_production(target):
              return target == 'production' or (isinstance(target, list) and 'production' in target)

          def walk(value):
              if isinstance(value, dict):
                  key = value.get('key')
                  target = value.get('target')
                  env_value = value.get('value')
                  if key in wanted and is_production(target) and isinstance(env_value, str) and env_value:
                      found[key] = env_value
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(payload)
          if not found:
              print('::error::Neither DATABASE_URL nor QUICKSDK_DATABASE_URL is available for Production.')
              raise SystemExit(1)
          with open(output_path, 'w', encoding='utf-8') as handle:
              for key, value in found.items():
                  handle.write(f'export {key}={shlex.quote(value)}\n')
          print('Production database environment prepared for migration without exposing values.')
          PY

          source "$ENV_EXPORTS"
          export MIGRATION_EXECUTION_CONTEXT=deploy
          export PYTHONPATH=backend:.
          python backend/scripts/run_schema_migrations.py

      - name: Deploy latest main to Vercel Production
        id: vercel
        if: steps.latest.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_FILE="$(mktemp)"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee "$OUTPUT_FILE"
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$OUTPUT_FILE" | tail -n 1 || true)"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify production health
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local url="$1"
            local attempts=18
            for i in $(seq 1 "$attempts"); do
              code="$(curl -sS -o /tmp/cf-health-body -w '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$code" = "200" ]; then
                echo "OK $url"
                cat /tmp/cf-health-body
                echo
                return 0
              fi
              echo "Attempt $i/$attempts: $url returned ${code:-network-error}; retrying..."
              sleep 5
            done
            echo "::error::$url did not become healthy after deployment."
            cat /tmp/cf-health-body 2>/dev/null || true
            return 1
          }

          check_url 'https://cf.hnchpower.cn/'
          check_url 'https://cf.hnchpower.cn/health'
          check_url 'https://cf.hnchpower.cn/health/db'

      - name: Deployment summary
        if: always() && steps.latest.outputs.deploy == 'true'
        run: |
          {
            echo '### Vercel Production'
            echo '- Git SHA: `${{ github.sha }}`'
            echo '- Production URL: `${{ steps.vercel.outputs.url }}`'
            echo '- Domain: `https://cf.hnchpower.cn`'
            echo '- Database migrations: serialized before Vercel deployment.'
            echo '- Contract AI provider: `Cloudflare Workers AI`.'
            echo '- Git auto-deployments: disabled; this workflow is the only release path.'
          } >> "$GITHUB_STEP_SUMMARY"
