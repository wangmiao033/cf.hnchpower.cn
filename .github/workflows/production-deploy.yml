name: Production Deploy

on:
  pull_request:
    paths:
      - '.github/workflows/production-deploy.yml'
      - 'vercel.json'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-hnchpower-production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_YfsD5pM9JFtkqXnJIUdbF2eI
  VERCEL_PROJECT_ID: prj_eMuMpXX2hUKvy7lSQ1deDIzoQDRN

jobs:
  vercel-token-preflight:
    name: Vercel token preflight
    runs-on: ubuntu-latest
    steps:
      - name: Confirm VERCEL_TOKEN is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is not configured. Add a Vercel access token before merging this workflow."
            exit 1
          fi
          echo "VERCEL_TOKEN is configured."

      - name: Diagnose project OIDC and AI Gateway
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_JSON="$(mktemp)"
          TOKEN_JSON="$(mktemp)"
          AI_JSON="$(mktemp)"
          trap 'rm -f "$PROJECT_JSON" "$TOKEN_JSON" "$AI_JSON"' EXIT

          PROJECT_CODE="$(curl -sS -o "$PROJECT_JSON" -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          echo "Project API HTTP: $PROJECT_CODE"
          if [ "$PROJECT_CODE" != "200" ]; then
            cat "$PROJECT_JSON"
            exit 1
          fi

          python - "$PROJECT_JSON" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          cfg=p.get('oidcTokenConfig') or {}
          print('oidcTokenConfig.enabled =', cfg.get('enabled'))
          print('oidcTokenConfig.issuerMode =', cfg.get('issuerMode'))
          PY

          TOKEN_CODE="$(curl -sS -o "$TOKEN_JSON" -w '%{http_code}' \
            -X POST "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/token?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"source":"cf-hnchpower-oidc-diagnosis"}')"
          echo "Project token API HTTP: $TOKEN_CODE"
          if [ "$TOKEN_CODE" != "200" ]; then
            python - "$TOKEN_JSON" <<'PY'
          import json, sys
          try:
              data=json.load(open(sys.argv[1], encoding='utf-8'))
          except Exception:
              print('Project token API returned non-JSON')
              raise SystemExit(1)
          err=data.get('error', data)
          if isinstance(err, dict):
              print('Project token error code:', err.get('code'))
              print('Project token error message:', err.get('message'))
          else:
              print('Project token error:', err)
          raise SystemExit(1)
          PY
          fi

          OIDC_TOKEN="$(python - "$TOKEN_JSON" <<'PY'
          import json, sys
          print(str(json.load(open(sys.argv[1], encoding='utf-8')).get('token') or '').strip())
          PY
          )"
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::Project token response has no token"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"

          OIDC_TOKEN="$OIDC_TOKEN" python - <<'PY'
          import base64, json, os, time
          token=os.environ['OIDC_TOKEN']
          parts=token.split('.')
          payload=parts[1] + '=' * (-len(parts[1]) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()))
          for key in ('iss','aud','sub','scope','iat','nbf','exp'):
              print(f'{key} =', claims.get(key))
          exp=claims.get('exp')
          if isinstance(exp,(int,float)):
              print('ttl_seconds =', int(exp-time.time()))
          PY

          AI_CODE="$(curl -sS -o "$AI_JSON" -w '%{http_code}' \
            -X POST 'https://ai-gateway.vercel.sh/v1/responses' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"model":"openai/gpt-5.4-mini","input":"Reply with exactly OK","max_output_tokens":8,"store":false}')"
          echo "AI Gateway OIDC test HTTP: $AI_CODE"
          if [ "$AI_CODE" != "200" ]; then
            python - "$AI_JSON" <<'PY'
          import json, sys
          try:
              data=json.load(open(sys.argv[1], encoding='utf-8'))
          except Exception:
              print('AI Gateway returned non-JSON')
              raise SystemExit(1)
          err=data.get('error', data)
          if isinstance(err, dict):
              print('AI Gateway error code:', err.get('code'))
              print('AI Gateway error message:', err.get('message'))
          else:
              print('AI Gateway error:', str(err)[:500])
          raise SystemExit(1)
          PY
          fi
          echo "Project OIDC token is accepted by AI Gateway."

  frontend:
    name: Frontend tests and build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend tests and compile check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests proxy contract_ai
      - name: Run backend unit tests
        env:
          PYTHONPATH: backend:.
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

  deploy:
    name: Single Vercel production deployment
    if: github.event_name != 'pull_request'
    needs:
      - vercel-token-preflight
      - frontend
      - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Skip stale main revisions
        id: latest
        shell: bash
        run: |
          git fetch origin main --depth=1
          LATEST_SHA="$(git rev-parse origin/main)"
          echo "Current workflow SHA: $GITHUB_SHA"
          echo "Latest main SHA:      $LATEST_SHA"
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main revision exists; this run will not create a Vercel deployment."
          fi

      - uses: actions/setup-node@v4
        if: steps.latest.outputs.deploy == 'true'
        with:
          node-version: '24'

      - name: Deploy latest main to Vercel Production
        id: vercel
        if: steps.latest.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_FILE="$(mktemp)"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee "$OUTPUT_FILE"
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$OUTPUT_FILE" | tail -n 1 || true)"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify production health
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local url="$1"
            local attempts=18
            for i in $(seq 1 "$attempts"); do
              code="$(curl -sS -o /tmp/cf-health-body -w '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$code" = "200" ]; then
                echo "OK $url"
                cat /tmp/cf-health-body
                echo
                return 0
              fi
              echo "Attempt $i/$attempts: $url returned ${code:-network-error}; retrying..."
              sleep 5
            done
            echo "::error::$url did not become healthy after deployment."
            cat /tmp/cf-health-body 2>/dev/null || true
            return 1
          }

          check_url 'https://cf.hnchpower.cn/'
          check_url 'https://cf.hnchpower.cn/health'
          check_url 'https://cf.hnchpower.cn/health/db'

      - name: Deployment summary
        if: always() && steps.latest.outputs.deploy == 'true'
        run: |
          {
            echo '### Vercel Production'
            echo '- Git SHA: `${{ github.sha }}`'
            echo '- Production URL: `${{ steps.vercel.outputs.url }}`'
            echo '- Domain: `https://cf.hnchpower.cn`'
            echo '- AI Gateway auth: Vercel OIDC (enable Secure Backend Access with OIDC Federation in Project Settings → Security).'
            echo '- Git auto-deployments: disabled; this workflow is the only release path.'
          } >> "$GITHUB_STEP_SUMMARY"
