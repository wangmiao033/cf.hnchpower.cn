name: Temporary Channel Save Validation Patch

on:
  push:
    branches:
      - fix/show-channel-save-validation-error

permissions:
  contents: write

concurrency:
  group: temp-channel-save-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/show-channel-save-validation-error
          fetch-depth: 0

      - name: Apply exact save-error patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/CoreChannelBillFormPage.jsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { ContractDifferenceBlockedError, transitionBillLifecycle } from '@/lib/api/billLifecycle.ts'\n"
          import_line = "import { getRecentApiErrorMessage } from '@/lib/api/client.ts'\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('billLifecycle import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = """      if (result === false) {\n        reportIssue('服务器没有接受本次保存。请按当前页提示定位问题，修正后再次保存。', {\n          kind: 'save',\n          title: '账单未保存'\n        })\n        return false\n      }\n"""
          new = """      if (result === false) {\n        const serverMessage = getRecentApiErrorMessage()\n        reportIssue(serverMessage || '服务器没有接受本次保存。请按当前页提示定位问题，修正后再次保存。', {\n          kind: 'save',\n          title: '账单未保存'\n        })\n        return false\n      }\n"""
          if old not in text:
              raise SystemExit('save false-branch anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -n "getRecentApiErrorMessage" src/pages/CoreChannelBillFormPage.jsx
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frontend tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit verified patch
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'wangmiao033'
          git config user.email '161289342+wangmiao033@users.noreply.github.com'
          git add src/pages/CoreChannelBillFormPage.jsx
          git commit -m 'fix: show exact backend validation on channel save'
          git push origin HEAD:fix/show-channel-save-validation-error
