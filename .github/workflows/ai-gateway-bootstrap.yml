name: AI Gateway Credential Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/ai-gateway-bootstrap.yml'
      - '.github/workflows/production-deploy.yml'
      - 'contract_ai/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_YfsD5pM9JFtkqXnJIUdbF2eI
  VERCEL_PROJECT_ID: prj_eMuMpXX2hUKvy7lSQ1deDIzoQDRN

jobs:
  preflight:
    name: Verify Production AI Gateway key
    runs-on: ubuntu-latest
    steps:
      - name: Check AI_GATEWAY_API_KEY exists in Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

          ENV_RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$ENV_RESPONSE_FILE"' EXIT
          HTTP_CODE="$(curl -sS \
            -o "$ENV_RESPONSE_FILE" \
            -w '%{http_code}' \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Unable to read Vercel Production environment variables (HTTP $HTTP_CODE)."
            exit 1
          fi

          python - "$ENV_RESPONSE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], 'r', encoding='utf-8') as handle:
              payload = json.load(handle)

          def walk(value):
              if isinstance(value, dict):
                  if value.get('key') == 'AI_GATEWAY_API_KEY':
                      return True
                  return any(walk(item) for item in value.values())
              if isinstance(value, list):
                  return any(walk(item) for item in value)
              return False

          if not walk(payload):
              print('::error::AI_GATEWAY_API_KEY is missing from cf-hnchpower-cn Production. Create a Vercel AI Gateway API key and add it as a Sensitive Production environment variable, then rerun this check.')
              raise SystemExit(1)

          print('AI_GATEWAY_API_KEY is configured for cf-hnchpower-cn Production.')
          PY
