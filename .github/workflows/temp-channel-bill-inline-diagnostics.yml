name: Temporary Channel Bill Inline Diagnostics

on:
  push:
    branches: [fix/channel-bill-inline-diagnostics]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'chore: stage channel bill inline diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/channel-bill-inline-diagnostics
          fetch-depth: 0

      - name: Apply inline diagnostics patch
        run: python scripts/apply_channel_bill_inline_diagnostics.py

      - name: Check generated diff
        run: |
          git diff --check
          git status --short

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            contract_terms/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r contract_terms/requirements.txt
          python -m pip check

      - name: Compile and test backend
        env:
          PYTHONPATH: backend:.
        run: |
          python -m compileall -q backend/app backend/tests proxy contract_terms
          python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Test contract service
        env:
          PYTHONPATH: contract_terms:.
        run: python -m unittest discover -s contract_terms -p 'test_*.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Test and build frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit verified feature
        run: |
          rm -f scripts/apply_channel_bill_inline_diagnostics.py
          rm -f .github/workflows/temp-channel-bill-inline-diagnostics.yml
          git config user.name 'wangmiao033'
          git config user.email '161289342+wangmiao033@users.noreply.github.com'
          git add -A
          git commit -m 'fix: add inline channel bill error diagnostics'
          git push origin HEAD:fix/channel-bill-inline-diagnostics
