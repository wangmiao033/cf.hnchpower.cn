name: Temporary Fast Channel Receipt Bank Match

on:
  push:
    branches:
      - fix/fast-channel-receipt-bank-match

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/fast-channel-receipt-bank-match
          fetch-depth: 0

      - name: Apply patch script
        run: python .github/scripts/patch_fast_channel_receipt_match.py

      - name: Structural checks
        run: |
          grep -n "build_bill_match_suggestions" backend/app/services/bank_multi_allocation.py
          grep -n "get_p2_bill_suggestions" backend/app/api/bank_auto_reconciliation.py
          grep -n "getBankBillMatchSuggestions" src/components/channel/ChannelReceiptDrawer.jsx
          if grep -q "getBankMultiAllocationDashboard" src/components/channel/ChannelReceiptDrawer.jsx; then exit 1; fi
          grep -n "旧版银行匹配接口异常" src/components/channel/ChannelReceiptDrawer.jsx
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frontend tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend compile and bank regressions
        run: |
          python -m pip install -r backend/requirements.txt
          python -m compileall -q backend/app
          cd backend
          pytest -q tests/test_bank_auto_reconciliation.py tests/test_bank_combination_match.py tests/test_bank_combination_match_anjiu.py tests/test_bank_filtered_historical_combination.py

      - name: Commit verified patch
        run: |
          git config user.name 'wangmiao033'
          git config user.email '161289342+wangmiao033@users.noreply.github.com'
          git add backend/app/services/bank_multi_allocation.py backend/app/api/bank_auto_reconciliation.py src/lib/api/bankAutoReconciliation.ts src/components/channel/ChannelReceiptDrawer.jsx src/lib/api/bankBillMatchSuggestions.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: speed up receipt bank matching and suppress legacy popup'
          git push origin HEAD:fix/fast-channel-receipt-bank-match
