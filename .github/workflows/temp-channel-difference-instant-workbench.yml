name: Temporary Channel Difference Instant Workbench

on:
  push:
    branches: [fix/channel-difference-instant-workbench]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/channel-difference-instant-workbench
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply_channel_difference_instant_workbench.py

      - name: Check diff
        run: |
          git diff --check
          git status --short

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            contract_terms/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r contract_terms/requirements.txt
          python -m pip check

      - name: Backend and contract tests
        env:
          PYTHONPATH: backend:.
        run: |
          python -m compileall -q backend/app backend/tests proxy contract_terms
          python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Contract service regression tests
        env:
          PYTHONPATH: contract_terms:.
        run: python -m unittest discover -s contract_terms -p 'test_*.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frontend tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit verified feature
        run: |
          rm -f scripts/apply_channel_difference_instant_workbench.py
          rm -f .github/workflows/temp-channel-difference-instant-workbench.yml
          git config user.name 'wangmiao033'
          git config user.email '161289342+wangmiao033@users.noreply.github.com'
          git add -A
          git commit -m 'fix: render contract differences instantly on bill edit'
          git push origin HEAD:fix/channel-difference-instant-workbench
