name: Production Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend + contract service tests and compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            contract_terms/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r contract_terms/requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests proxy contract_terms

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend:.
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Run contract settlement regression tests
        env:
          PYTHONPATH: contract_terms:.
        run: python -m unittest discover -s contract_terms -p 'test_*.py' -v

  patch_contract_owned_rates:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/enforce-contract-owned-rates-20260824'
    name: Apply contract-owned rate patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/enforce-contract-owned-rates-20260824
          fetch-depth: 0

      - name: Patch bill fields and remove temporary workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/channel/ChannelBillingForm.jsx')
          text = path.read_text(encoding='utf-8')
          pairs = [
              (
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.shareRate} onChange={(e) => handleLineChange(index, 'shareRate', e.target.value)} placeholder="合同带入/人工填写" /></td>''',
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.shareRate} readOnly aria-label="合同分成比例" placeholder="合同带入/补清单" /></td>''',
              ),
              (
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.taxRate} onChange={(e) => handleLineChange(index, 'taxRate', e.target.value)} placeholder="合同带入/填0" /></td>''',
                  '''                  <td><input type="number" step="0.01" className="admin-input" value={row.taxRate} readOnly aria-label="合同税率" placeholder="合同带入/补清单" /></td>''',
              ),
              (
                  '''第 ${i + 1} 行：分成比例尚未由合同确定，请等待合同匹配或人工填写''',
                  '''第 ${i + 1} 行：分成比例尚未由合同确定，请先补合作清单或重新匹配合同''',
              ),
              (
                  '''第 ${i + 1} 行：税率尚未由合同确定，请等待合同匹配或人工填写 0''',
                  '''第 ${i + 1} 行：税率尚未由合同确定，请先补合作清单或重新匹配合同''',
              ),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'anchor not found: {old[:48]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('src/components/channel/channelContractSafety.test.js')
          test = test_path.read_text(encoding='utf-8')
          anchor = '''  it('labels technical errors separately from business rule gaps', () => {'''
          addition = '''  it('prevents direct editing of contract-owned share and tax rates', () => {
    expect(billingSource).toContain('readOnly aria-label="合同分成比例"')
    expect(billingSource).toContain('readOnly aria-label="合同税率"')
    expect(billingSource).toContain('分成比例尚未由合同确定，请先补合作清单或重新匹配合同')
    expect(billingSource).toContain('税率尚未由合同确定，请先补合作清单或重新匹配合同')
  })

'''
          if addition.strip() not in test:
              if anchor not in test:
                  raise SystemExit('test anchor not found')
              test = test.replace(anchor, addition + anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          git checkout origin/main -- .github/workflows/production-quality.yml
          rm -f .github/workflows/oneoff-enforce-contract-owned-rates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce contract-owned share and tax rates'
          git push origin HEAD:fix/enforce-contract-owned-rates-20260824
