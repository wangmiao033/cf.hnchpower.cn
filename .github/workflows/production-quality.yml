name: Production Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-contract-share:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/lock-contract-share-rate-20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply contract share lock and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/channel/ChannelBillingForm.jsx')
          text = path.read_text(encoding='utf-8')
          old = '''              const rowRuleHeader = resolveChannelLineRuleHeader(row, effectiveRuleHeader)
              const rowFeeMode = rowRuleHeader.channelFeeMode || 'fixed'
              const details = calculateSettlementDetails(row, rowRuleHeader)
              const monthRisk = settlementMonthRisk(row.settlementCycle, currentMonthKey)
              return ('''
          new = '''              const rowRuleHeader = resolveChannelLineRuleHeader(row, effectiveRuleHeader)
              const rowFeeMode = rowRuleHeader.channelFeeMode || 'fixed'
              const contractLineRule = (contractRuleState.recommendation?.lines || []).find((item) => item.line_index === index)
              const contractShareRate = autoApplyContractRules && contractLineRule?.match && contractLineRule?.auto_apply && contractLineRule?.recommended?.share_rate != null
                ? Number(contractLineRule.recommended.share_rate)
                : null
              const details = calculateSettlementDetails(row, rowRuleHeader)
              const monthRisk = settlementMonthRisk(row.settlementCycle, currentMonthKey)
              return ('''
          if old not in text:
              raise SystemExit('row render anchor not found')
          text = text.replace(old, new, 1)
          old = '''                  <td><input type="number" step="0.01" className="admin-input" value={row.shareRate} onChange={(e) => handleLineChange(index, 'shareRate', e.target.value)} placeholder="合同带入/人工填写" /></td>'''
          new = '''                  {contractShareRate != null ? (
                    <td className="channel-line-num" title="来自合同合作清单；如需修改请先调整合同规则">{contractShareRate}%</td>
                  ) : (
                    <td><input type="number" step="0.01" className="admin-input" value={row.shareRate} onChange={(e) => handleLineChange(index, 'shareRate', e.target.value)} placeholder="待合同匹配/补清单" /></td>
                  )}'''
          if old not in text:
              raise SystemExit('share rate cell not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('src/components/channel/channelContractSafety.test.js')
          test = test_path.read_text(encoding='utf-8')
          anchor = '''  it('labels technical errors separately from business rule gaps', () => {'''
          addition = '''  it('locks share rate to the matched contract rule instead of asking for repeated input', () => {
    expect(billingSource).toContain('const contractShareRate = autoApplyContractRules')
    expect(billingSource).toContain('contractLineRule?.match && contractLineRule?.auto_apply')
    expect(billingSource).toContain('来自合同合作清单；如需修改请先调整合同规则')
    expect(billingSource).toContain('待合同匹配/补清单')
  })

'''
          if addition.strip() not in test:
              if anchor not in test:
                  raise SystemExit('test anchor not found')
              test = test.replace(anchor, addition + anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/production-quality.yml
          rm -f .github/workflows/oneoff-lock-contract-share.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: lock channel share rate to matched contract rule'
          git push origin HEAD:${{ github.head_ref }}

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend + contract service tests and compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            contract_terms/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r contract_terms/requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests proxy contract_terms

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend:.
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Run contract settlement regression tests
        env:
          PYTHONPATH: contract_terms:.
        run: python -m unittest discover -s contract_terms -p 'test_*.py' -v
