name: Temp Channel Contract Authority Check
on:
  push:
    branches: [codex/channel-contract-list-authority-fix]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r contract_terms/requirements.txt
      - run: python -m compileall -q contract_terms
      - run: PYTHONPATH=contract_terms:. python -m unittest discover -s contract_terms -p 'test_*.py' -v
