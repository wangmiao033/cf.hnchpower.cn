name: Xian Weizhen 9917 Feature Quality

on:
  push:
    branches:
      - codex/xian-weizhen-9917-settlement-rule

permissions:
  contents: read

concurrency:
  group: xian-weizhen-9917-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend settlement regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m unittest discover -s tests -p 'test_channel_settlement*.py' -v
