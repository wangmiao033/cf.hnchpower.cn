name: One-off channel history recognition final

on:
  push:
    branches:
      - fix/channel-history-recognition-final-20260827

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/channel-history-recognition-final-20260827
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_channel_history_recognition.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: recognize previous-month channel games"
          git push origin HEAD:fix/channel-history-recognition-final-20260827
