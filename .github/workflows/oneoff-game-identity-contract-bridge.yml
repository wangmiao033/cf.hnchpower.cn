name: One-off game identity contract bridge

on:
  push:
    branches:
      - feat/game-identity-contract-bridge-20260824
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'feat/game-identity-contract-bridge-20260824' || github.head_ref == 'feat/game-identity-contract-bridge-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Patch identity-aware contract matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)

          # matcher.py: stable IDs outrank names when available.
          path = Path('contract_terms/matcher.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def score_candidate(')
          end = text.index('\n\ndef _check(', start)
          new_func = '''def score_candidate(bill: dict, line: dict, candidate: dict) -> dict:
    bill_partner_id = str(bill.get("partner_id") or "").strip()
    candidate_partner_id = str(candidate.get("partner_id") or "").strip()
    bill_partner = normalize_company(bill.get("partner_name"))
    candidate_partners = [
        normalize_company(candidate.get("partner_name")),
        normalize_company(candidate.get("partner_short_name")),
        normalize_company(candidate.get("counterparty")),
    ]
    if bill_partner_id and candidate_partner_id:
        partner_similarity = 1.0 if bill_partner_id == candidate_partner_id else 0.0
        partner_id_conflict = bill_partner_id != candidate_partner_id
    else:
        partner_similarity = max((_similarity(bill_partner, item, containment_floor=5) for item in candidate_partners), default=0.0)
        partner_id_conflict = False

    line_game_id = str(line.get("game_id") or "").strip()
    candidate_game_id = str(candidate.get("game_id") or "").strip()
    if line_game_id and candidate_game_id:
        game_similarity = 1.0 if line_game_id == candidate_game_id else 0.0
        game_id_conflict = line_game_id != candidate_game_id
        variant_conflict = False
    else:
        game_similarity = _similarity(
            normalize_game(line.get("game_name")),
            normalize_game(candidate.get("product_name")),
            containment_floor=4,
        )
        line_variant = commercial_game_variant(line.get("game_name"))
        candidate_variant = commercial_game_variant(candidate.get("product_name"))
        variant_conflict = bool(line_variant and candidate_variant and line_variant != candidate_variant)
        game_id_conflict = False

    line_variant = commercial_game_variant(line.get("game_name"))
    candidate_variant = commercial_game_variant(candidate.get("product_name"))
    channel_similarity = _similarity(
        normalize_channel(bill.get("channel_name")),
        normalize_channel(candidate.get("channel_name")),
        containment_floor=3,
    )
    auth_relation = authorization_relation(
        line.get("settlement_cycle") or bill.get("settlement_month"),
        candidate.get("authorization_start"),
        candidate.get("authorization_end"),
    )

    eligible = (
        game_similarity > 0
        and not variant_conflict
        and not game_id_conflict
        and not partner_id_conflict
        and (partner_similarity > 0 or not bill_partner)
    )
    score = 0.0
    reasons: list[str] = []
    if eligible:
        score += 35 * (partner_similarity if bill_partner or bill_partner_id else 0.45)
        score += 40 * game_similarity
        if line_game_id and candidate_game_id and line_game_id == candidate_game_id:
            reasons.append("游戏ID一致")
        elif game_similarity == 1:
            reasons.append("游戏名称一致")
        else:
            reasons.append("游戏名称高度相似")

        if line_variant and not (line_game_id and candidate_game_id):
            if candidate_variant == line_variant:
                reasons.append(f"商业版本一致（{line_variant}）")
            elif not candidate_variant:
                score -= 12
                reasons.append(f"合同未标注{line_variant}版本，按基础游戏名兜底")

        if bill_partner_id and candidate_partner_id and bill_partner_id == candidate_partner_id:
            reasons.append("合作方ID一致")
        elif partner_similarity == 1:
            reasons.append("合作方一致")
        elif partner_similarity > 0:
            reasons.append("合作方名称相似")

        if auth_relation == "covered":
            score += 18
            reasons.append("账期在授权期内")
        elif auth_relation == "unknown":
            score += 6
            reasons.append("授权期信息不完整")
        else:
            score -= 30
            reasons.append("账期不在授权期内")

        bill_channel = normalize_channel(bill.get("channel_name"))
        candidate_channel = normalize_channel(candidate.get("channel_name"))
        if bill_channel and candidate_channel:
            if channel_similarity == 1:
                score += 7
                reasons.append("渠道一致")
            elif channel_similarity > 0:
                score += 4
                reasons.append("渠道名称相似")
            else:
                score -= 3
                reasons.append("渠道名称不同")
        elif candidate_channel:
            score += 2

    score = max(0.0, min(100.0, round(score, 1)))
    confidence = "high" if score >= 82 else "medium" if score >= 65 else "low"
    return {
        "eligible": eligible,
        "score": score,
        "confidence": confidence,
        "authorization_status": auth_relation,
        "reasons": reasons,
    }
'''
          text = text[:start] + new_func + text[end:]
          path.write_text(text, encoding='utf-8')

          # recommender.py: pass stable partner/game IDs through identity selection.
          path = Path('contract_terms/channel_rule_recommender.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'def _partner_matches(partner_name: str, candidate: dict) -> bool:\n    target = normalize_company(partner_name)',
              'def _partner_matches(partner_name: str, candidate: dict, partner_id: str = "") -> bool:\n    wanted_id = str(partner_id or "").strip()\n    candidate_id = str(candidate.get("partner_id") or "").strip()\n    if wanted_id and candidate_id:\n        return wanted_id == candidate_id\n    target = normalize_company(partner_name)',
              'partner matcher signature',
          )
          text = replace_once(
              text,
              'def _exact_game_matches(game_name: str, candidate: dict) -> bool:\n    target = normalize_game(game_name)\n    product = normalize_game(candidate.get("product_name"))\n    return bool(target and product and target == product)',
              'def _exact_game_matches(game_name: str, candidate: dict, game_id: str = "") -> bool:\n    wanted_id = str(game_id or "").strip()\n    candidate_id = str(candidate.get("game_id") or "").strip()\n    if wanted_id and candidate_id:\n        return wanted_id == candidate_id\n    target = normalize_game(game_name)\n    product = normalize_game(candidate.get("product_name"))\n    return bool(target and product and target == product)',
              'game matcher',
          )
          text = replace_once(
              text,
              'def _partner_rule_summary(partner_name: str, candidates: list[dict]) -> dict:\n    all_matched = [candidate for candidate in candidates if _partner_matches(partner_name, candidate)]',
              'def _partner_rule_summary(partner_name: str, candidates: list[dict], partner_id: str = "") -> dict:\n    all_matched = [candidate for candidate in candidates if _partner_matches(partner_name, candidate, partner_id)]',
              'partner summary',
          )
          start = text.index('def _selection_pool(')
          end = text.index('\n\ndef recommend_channel_rules(', start)
          selection = '''def _selection_pool(ranked: list[tuple[dict, dict, dict]], line: dict) -> list[tuple[dict, dict, dict]]:
    if not ranked:
        return []

    game_name = str(line.get("game_name") or "")
    game_id = str(line.get("game_id") or "")
    exact_game = [item for item in ranked if _exact_game_matches(game_name, item[0], game_id)]
    identity_pool = exact_game or ranked

    in_range = [item for item in identity_pool if item[1].get("authorization_status") != "out_of_range"]
    pool = in_range or identity_pool

    complete = [item for item in pool if item[2].get("fields_complete")]
    return complete or pool
'''
          text = text[:start] + selection + text[end:]
          text = replace_once(
              text,
              'def recommend_channel_rules(\n    partner_name: str,\n    channel_name: str,\n    lines: list[dict],\n    candidates: list[dict],\n) -> dict:',
              'def recommend_channel_rules(\n    partner_name: str,\n    channel_name: str,\n    lines: list[dict],\n    candidates: list[dict],\n    partner_id: str = "",\n) -> dict:',
              'recommend signature',
          )
          text = replace_once(text, 'partner_summary = _partner_rule_summary(partner_name, candidates)', 'partner_summary = _partner_rule_summary(partner_name, candidates, partner_id)', 'partner summary call')
          text = replace_once(
              text,
              '        bill = {\n            "partner_name": partner_name,\n            "channel_name": channel_name,',
              '        bill = {\n            "partner_name": partner_name,\n            "partner_id": partner_id,\n            "channel_name": channel_name,',
              'bill partner id',
          )
          text = replace_once(
              text,
              '            "game_name": game_name,\n            "settlement_cycle": cycle,',
              '            "game_name": game_name,\n            "game_id": str(raw.get("game_id") or ""),\n            "settlement_cycle": cycle,',
              'line game id',
          )
          text = replace_once(text, '        pool = _selection_pool(ranked, game_name)', '        pool = _selection_pool(ranked, line)', 'selection pool call')
          text = replace_once(
              text,
              '        exact_identity = _partner_matches(partner_name, candidate) and _exact_game_matches(game_name, candidate)',
              '        exact_identity = _partner_matches(partner_name, candidate, partner_id) and _exact_game_matches(game_name, candidate, str(line.get("game_id") or ""))',
              'exact identity',
          )
          text = replace_once(
              text,
              '                    "game_name": game_name,\n                    "settlement_cycle": cycle,',
              '                    "game_name": game_name,\n                    "game_id": str(line.get("game_id") or ""),\n                    "settlement_cycle": cycle,',
              'unmatched game id',
          )
          text = replace_once(
              text,
              '                "game_name": game_name,\n                "settlement_cycle": cycle,',
              '                "game_name": game_name,\n                "game_id": str(line.get("game_id") or ""),\n                "settlement_cycle": cycle,',
              'matched game id',
          )
          text = replace_once(
              text,
              '                    "access_item_id": candidate.get("access_item_id"),\n                    "product_name": candidate.get("product_name"),',
              '                    "access_item_id": candidate.get("access_item_id"),\n                    "game_id": candidate.get("game_id"),\n                    "game_identity_source": candidate.get("game_identity_source"),\n                    "product_name": candidate.get("product_name"),',
              'match identity metadata',
          )
          path.write_text(text, encoding='utf-8')

          # extended_main.py: enrich request lines/candidates from the registry bridge.
          path = Path('contract_terms/extended_main.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    from .channel_rule_recommender import recommend_channel_rules\n',
              '    from .channel_rule_recommender import recommend_channel_rules\n    from .game_identity import enrich_candidates_with_game_ids, enrich_lines_with_game_ids\n',
              'relative identity import',
          )
          text = replace_once(
              text,
              '    from channel_rule_recommender import recommend_channel_rules\n',
              '    from channel_rule_recommender import recommend_channel_rules\n    from game_identity import enrich_candidates_with_game_ids, enrich_lines_with_game_ids\n',
              'root identity import',
          )
          text = replace_once(
              text,
              '      access.contract_id,\n      access.channel_name,',
              '      access.contract_id,\n      contract.partner_id,\n      access.channel_name,',
              'candidate partner id',
          )
          text = replace_once(
              text,
              '            rows = conn.execute(_CANDIDATE_SQL).fetchall()\n            return [dict(row) for row in rows]',
              '            rows = [dict(row) for row in conn.execute(_CANDIDATE_SQL).fetchall()]\n            return enrich_candidates_with_game_ids(conn, rows)',
              'candidate enrichment',
          )
          text = replace_once(
              text,
              '    partner_name = str(payload.get("partner_name") or "").strip()\n    channel_name = str(payload.get("channel_name") or "").strip()',
              '    partner_name = str(payload.get("partner_name") or "").strip()\n    partner_id = str(payload.get("partner_id") or "").strip()\n    channel_name = str(payload.get("channel_name") or "").strip()',
              'endpoint partner id',
          )
          text = replace_once(
              text,
              '        candidates = _candidate_rows(conn)\n        result = recommend_channel_rules(partner_name, channel_name, lines, candidates)',
              '        candidates = _candidate_rows(conn)\n        resolved_lines = enrich_lines_with_game_ids(conn, lines)\n        result = recommend_channel_rules(partner_name, channel_name, resolved_lines, candidates, partner_id=partner_id)',
              'endpoint identity resolution',
          )
          path.write_text(text, encoding='utf-8')

          # Frontend API can pass the stable customer ID.
          path = Path('src/lib/api/contractTerms.ts')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "  partner_name: string\n  channel_name?: string",
              "  partner_name: string\n  partner_id?: string\n  channel_name?: string",
              'frontend partner id type',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/components/channel/ChannelBillingForm.jsx')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '        partner_name: partnerName,\n        channel_name: String(header.channelName || \'\').trim(),',
              '        partner_name: partnerName,\n        partner_id: String(partnerId || \'\'),\n        channel_name: String(header.channelName || \'\').trim(),',
              'billing form partner id',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/domain/channel/channelRuleAuthority.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    partner_name: partnerName,\n    channel_name: channelName,',
              '    partner_name: partnerName,\n    partner_id: String(record?.partnerId || record?.partner_id || \'\'),\n    channel_name: channelName,',
              'authority partner id',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/pages/CoreChannelBillFormPage.jsx')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '  const smartEntryRecord = smartEntryPartner\n    ? currentRecord',
              '  const smartEntryRecord = smartEntryPartner\n    ? { ...currentRecord, partnerId: String(smartEntryPartner.id || \'\') }',
              'smart entry stable partner id',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          rm -f .github/workflows/oneoff-game-identity-contract-bridge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contract_terms/matcher.py contract_terms/channel_rule_recommender.py contract_terms/extended_main.py src/lib/api/contractTerms.ts src/components/channel/ChannelBillingForm.jsx src/domain/channel/channelRuleAuthority.js src/pages/CoreChannelBillFormPage.jsx .github/workflows/oneoff-game-identity-contract-bridge.yml
          git commit -m 'feat: route contract matching through stable game and partner identities'
          git push origin HEAD:"$BRANCH"
