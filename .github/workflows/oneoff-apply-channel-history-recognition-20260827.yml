name: One-off apply channel history recognition 20260827

on:
  push:
    branches:
      - fix/channel-history-recognition-20260827

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/channel-history-recognition-20260827
          fetch-depth: 0

      - name: Apply historical game recognition patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          smart = Path('src/components/channel/ChannelSmartEntryBar.jsx')
          source = smart.read_text(encoding='utf-8')

          contract_key_line = "  const contractGameKeys = useMemo(() => new Set(contractGames.map((item) => textKey(item.gameName))), [contractGames])"
          historical_block = "\n".join([
            "  const historicalGameKeys = useMemo(() => new Set(previousLines",
            "    .map((item) => textKey(resolveGameName(item?.gameName)))",
            "    .filter(Boolean)), [previousLines, resolveGameName])",
          ])
          if 'const historicalGameKeys = useMemo' not in source:
            if contract_key_line not in source:
              raise SystemExit('contractGameKeys target not found')
            source = source.replace(contract_key_line, contract_key_line + "\n" + historical_block, 1)

          old_missing = "\n".join([
            "  const missingGames = useMemo(() => namedLines(record)",
            "    .map((item) => String(item.gameName || '').trim())",
            "    .filter((name) => name && !contractGameKeys.has(textKey(resolveGameName(name)))), [record, contractGameKeys, resolveGameName])",
          ])
          new_missing = "\n".join([
            "  const missingGames = useMemo(() => namedLines(record)",
            "    .map((item) => String(item.gameName || '').trim())",
            "    .filter((name) => {",
            "      const key = textKey(resolveGameName(name))",
            "      return name && !contractGameKeys.has(key) && !historicalGameKeys.has(key)",
            "    }), [record, contractGameKeys, historicalGameKeys, resolveGameName])",
          ])
          if old_missing in source:
            source = source.replace(old_missing, new_missing, 1)
          elif '!historicalGameKeys.has(key)' not in source:
            raise SystemExit('missingGames target not found')

          matched_line = "  const matchedLineCount = namedLines(record).filter((line) => contractGameFor(line.gameName)).length"
          historical_count = "\n".join([
            "  const historicalMatchedLineCount = namedLines(record).filter((line) => {",
            "    const key = textKey(resolveGameName(line.gameName))",
            "    return !contractGameKeys.has(key) && historicalGameKeys.has(key)",
            "  }).length",
          ])
          if 'const historicalMatchedLineCount = namedLines(record).filter' not in source:
            if matched_line not in source:
              raise SystemExit('matchedLineCount target not found')
            source = source.replace(matched_line, matched_line + "\n" + historical_count, 1)

          source = source.replace(
            "            <strong>发现 {missingGames.length} 个游戏缺少合同合作清单</strong>",
            "            <strong>发现 {missingGames.length} 个游戏既无合同清单，也无历史账单记录</strong>",
            1,
          )
          source = source.replace(
            "            <span>补清单、映射名称、挂起待补，都在当前账单完成。</span>",
            "            <span>只有真正的新游戏才需要补清单、映射名称或挂起待补。</span>",
            1,
          )
          source = source.replace(
            "            <span>{matchedLineCount} 个游戏已匹配合同；规则不对或资料没齐都不用跳页面。</span>",
            "            <span>{matchedLineCount} 个游戏已匹配合同{historicalMatchedLineCount ? ` · ${historicalMatchedLineCount} 个按上月历史识别` : ''}；只有真正新游戏才需要补资料。</span>",
            1,
          )
          smart.write_text(source, encoding='utf-8')

          test_file = Path('src/components/channel/channelContractSafety.test.js')
          test_source = test_file.read_text(encoding='utf-8')
          if "treats previous-month games as recognized instead of forcing a contract supplement" not in test_source:
            marker = "  it('labels technical errors separately from business rule gaps', () => {\n"
            block = "\n".join([
              "  it('treats previous-month games as recognized instead of forcing a contract supplement', () => {",
              "    expect(smartEntrySource).toContain('const historicalGameKeys = useMemo')",
              "    expect(smartEntrySource).toContain('!contractGameKeys.has(key) && !historicalGameKeys.has(key)')",
              "    expect(smartEntrySource).toContain('const historicalMatchedLineCount = namedLines(record).filter')",
              "    expect(smartEntrySource).toContain('个按上月历史识别')",
              "    expect(smartEntrySource).toContain('只有真正的新游戏才需要补清单')",
              "  })",
              "",
            ])
            if marker not in test_source:
              raise SystemExit('test insertion marker not found')
            test_source = test_source.replace(marker, block + marker, 1)
          test_file.write_text(test_source, encoding='utf-8')
          PY

          rm -f .github/.trigger-channel-history-recognition-20260827
          rm -f .github/workflows/oneoff-apply-channel-history-recognition-20260827.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: recognize previous-month channel games'
          git push origin HEAD:fix/channel-history-recognition-20260827
