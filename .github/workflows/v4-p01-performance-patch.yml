name: V4 P0.1 Performance Regression

on:
  push:
    branches:
      - codex/v4-p01-bill360-performance
    paths:
      - '.github/workflows/v4-p01-performance-patch.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4-p01-bill360-performance
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4-p01-bill360-performance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_*.py'
