          )
          replace_once(
              'src/components/reconciliation/Bill360DrawerBase.jsx',
              "                    {attachments.length + bankAttachments.length === 0 ? <div className=\"bill360-empty-block\">当前账单没有附件。</div> : null}",
              "                    {attachmentsLoading ? <div className=\"bill360-empty-block\">正在读取附件…</div> : attachments.length + bankAttachments.length === 0 ? <div className=\"bill360-empty-block\">当前账单没有附件。</div> : null}",
              'attachment loading label'
          )

          # Outer 360: expensive contract calculation and cumulative check only when user opens them.
          replace_once(
              'src/components/reconciliation/Bill360Drawer.jsx',
              "import { getChannelCumulativeBillCondition } from '@/lib/api/channelCumulativeSettlement.ts'\n",
              "import { getChannelCumulativeBillCondition } from '@/lib/api/channelCumulativeSettlement.ts'\nimport { loadBill360Resource, peekBill360Resource } from '@/lib/api/bill360Performance.ts'\n",
              'outer cache import'
          )
          replace_once(
              'src/components/reconciliation/Bill360Drawer.jsx',
              "  if (!summary) return '合同自动核验'",
              "  if (!summary) return '合同核验 · 点击加载'",
              'contract launcher copy'
          )
          replace_once(
              'src/components/reconciliation/Bill360Drawer.jsx',
              "  const loadContractCheck = useCallback(async () => {\n    if (!billId) return null\n    setCheckLoading(true)\n    setCheckUnavailable(false)\n    try {\n      const result = await getContractBillReconciliation(billType, billId)\n      setCheckData(result)\n      setCheckSummary(result.summary || null)\n      setCheckVersion((value) => value + 1)\n      return result\n    } catch (error) {\n      console.error(error)\n      setCheckUnavailable(true)\n      return null\n    } finally {\n      setCheckLoading(false)\n    }\n  }, [billId, billType])\n\n  useEffect(() => {\n    setCheckData(null)\n    setCheckSummary(null)\n    void loadContractCheck()\n  }, [loadContractCheck])",
              "  const loadContractCheck = useCallback(async (force = false) => {\n    if (!billId) return null\n    setCheckLoading(true)\n    setCheckUnavailable(false)\n    try {\n      const result = await loadBill360Resource(\n        `contract-check:${billType}:${billId}`,\n        () => getContractBillReconciliation(billType, billId),\n        { ttlMs: 60_000, force }\n      )\n      setCheckData(result)\n      setCheckSummary(result.summary || null)\n      setCheckVersion((value) => value + 1)\n      return result\n    } catch (error) {\n      console.error(error)\n      setCheckUnavailable(true)\n      return null\n    } finally {\n      setCheckLoading(false)\n    }\n  }, [billId, billType])\n\n  const refreshContractCheck = useCallback(() => loadContractCheck(true), [loadContractCheck])\n\n  useEffect(() => {\n    const cached = peekBill360Resource(`contract-check:${billType}:${billId}`)\n    setCheckData(cached || null)\n    setCheckSummary(cached?.summary || null)\n    setCheckUnavailable(false)\n  }, [billId, billType])",
              'lazy contract check'
          )
          replace_once(
              'src/components/reconciliation/Bill360Drawer.jsx',
              "  useEffect(() => {\n    if (billType !== 'channel' || !billId) {\n      setCumulativeCondition(null)\n      return undefined\n    }\n    let active = true\n    void getChannelCumulativeBillCondition(billId)\n      .then((result) => {\n        if (active) setCumulativeCondition(result)\n      })\n      .catch(() => {\n        if (active) setCumulativeCondition(null)\n      })\n    return () => { active = false }\n  }, [billId, billType])",
              "  useEffect(() => {\n    setCumulativeCondition(null)\n  }, [billId, billType])\n\n  useEffect(() => {\n    if (!fundingOpen || billType !== 'channel' || !billId) return undefined\n    let active = true\n    void getChannelCumulativeBillCondition(billId)\n      .then((result) => {\n        if (active) setCumulativeCondition(result)\n      })\n      .catch(() => {\n        if (active) setCumulativeCondition(null)\n      })\n    return () => { active = false }\n  }, [billId, billType, fundingOpen])",
              'lazy cumulative check'
          )
          replace_once(
              'src/components/reconciliation/Bill360Drawer.jsx',
              "  const tone = checkSummary?.unresolved_difference_lines || checkSummary?.fail_count\n    ? 'fail'\n    : checkSummary?.handled_difference_lines || checkSummary?.issue_count\n      ? 'warning'\n      : checkSummary\n        ? 'pass'\n        : 'neutral'\n\n  return (",
              "  const tone = checkSummary?.unresolved_difference_lines || checkSummary?.fail_count\n    ? 'fail'\n    : checkSummary?.handled_difference_lines || checkSummary?.issue_count\n      ? 'warning'\n      : checkSummary\n        ? 'pass'\n        : 'neutral'\n\n  const openContractCheck = () => {\n    setCheckOpen(true)\n    if (!checkData && !checkLoading) void loadContractCheck(false)\n  }\n\n  return (",
              'contract click handler'
          )
          replace_once('src/components/reconciliation/Bill360Drawer.jsx', 'onClick={() => setCheckOpen(true)}', 'onClick={openContractCheck}', 'contract click lazy')
          replace_once('src/components/reconciliation/Bill360Drawer.jsx', 'onChanged={loadContractCheck}', 'onChanged={refreshContractCheck}', 'carry forward refresh')
          replace_once('src/components/reconciliation/Bill360Drawer.jsx', 'onChanged={loadContractCheck}', 'onChanged={refreshContractCheck}', 'difference refresh')
          replace_once(
