name: V4 P0.1 Apply Performance Refactor

on:
  push:
    branches:
      - codex/v4-p01-bill360-performance
    paths:
      - '.github/workflows/v4-p01-performance-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4-p01-bill360-performance
          fetch-depth: 0

      - name: Apply performance post-fix
        run: python scripts/v4_p01_postfix.py

      - name: Verify refactor scope
        run: |
          git diff --check
          ! grep -n '^\\$' src/components/reconciliation/Bill360DrawerBase.jsx
          grep -q "primeBill360Resource" src/components/reconciliation/Bill360Drawer.jsx
          grep -q "onDataChange={handleContractDataChange}" src/components/reconciliation/Bill360Drawer.jsx

      - name: Commit performance post-fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/reconciliation/Bill360DrawerBase.jsx src/components/reconciliation/Bill360Drawer.jsx
          git commit -m "perf: remove duplicate contract fetch and fix progressive drawer syntax"
          git push origin HEAD:codex/v4-p01-bill360-performance
