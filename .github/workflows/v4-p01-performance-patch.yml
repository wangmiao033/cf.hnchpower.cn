          # Contract panel: consume outer result instead of immediately requesting the same heavy reconciliation twice.
          replace_once(
              'src/components/reconciliation/BillContractCheckPanelV2.jsx',
              'export default function BillContractCheckPanelV2({ billType, billId }) {',
              'export default function BillContractCheckPanelV2({ billType, billId, initialData = null, onDataChange }) {',
