name: V4 P0.1 Apply Performance Refactor

on:
  push:
    branches:
      - codex/v4-p01-bill360-performance
    paths:
      - '.github/workflows/v4-p01-performance-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4-p01-bill360-performance
          fetch-depth: 0

      - name: Apply performance refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 target in {path}, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_span(path, start_marker, end_marker, replacement, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker not found in {path}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: end marker not found in {path}')
              p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          # Register the read-optimized Bill360 endpoint on the existing reconciliation permission boundary.
          replace_once(
              'backend/app/main.py',
              'from app.api.anomaly import router as anomaly_router\n',
              'from app.api.anomaly import router as anomaly_router\nfrom app.api.bill360_performance import router as bill360_performance_router\n',
              'backend router import'
          )
          replace_once(
              'backend/app/main.py',
              'app.include_router(reconciliation_router, prefix="/api/reconciliation", tags=["reconciliation"], dependencies=[reconciliation_access])\n',
              'app.include_router(reconciliation_router, prefix="/api/reconciliation", tags=["reconciliation"], dependencies=[reconciliation_access])\napp.include_router(bill360_performance_router, prefix="/api/reconciliation", tags=["bill360-performance"], dependencies=[reconciliation_access])\n',
              'backend router registration'
          )

          # Bill360 base: use edit cache + progressive independent resources, not one giant Promise.all.
          replace_once(
              'src/components/reconciliation/Bill360DrawerBase.jsx',
              "import { getBillInvoiceSummary } from '@/lib/api/billInvoiceAllocations.ts'\nimport { listContracts } from '@/lib/api/contract.ts'\nimport { getQuickSdkGameFlow } from '@/lib/api/quicksdk.ts'\n",
              "import { getBillInvoiceSummary } from '@/lib/api/billInvoiceAllocations.ts'\nimport { listContracts } from '@/lib/api/contract.ts'\nimport { getCachedEditRecord, loadEditRecord } from '@/lib/api/editRecordCache.js'\nimport {\n  getBill360QuickSdkSummary,\n  loadBill360Resource,\n  peekBill360Resource,\n  scheduleBill360Idle\n} from '@/lib/api/bill360Performance.ts'\n",
              'bill360 performance imports'
          )

          replace_once(
              'src/components/reconciliation/Bill360DrawerBase.jsx',
              "  const [activeTab, setActiveTab] = useState('overview')\n  const [record, setRecord] = useState(target?.initialRecord || null)\n  const [invoiceSummary, setInvoiceSummary] = useState(null)\n  const [quickSdkRows, setQuickSdkRows] = useState([])\n  const [contracts, setContracts] = useState([])\n  const [attachments, setAttachments] = useState([])\n  const [payments, setPayments] = useState([])\n  const [bankInstruction, setBankInstruction] = useState(null)\n  const [bankAttachments, setBankAttachments] = useState([])\n  const [loading, setLoading] = useState(true)\n  const [error, setError] = useState('')\n\n  const billType = target?.billType === 'channel' ? 'channel' : 'rd'\n  const billId = String(target?.billId || '')\n",
              "  const billType = target?.billType === 'channel' ? 'channel' : 'rd'\n  const billId = String(target?.billId || '')\n  const initialSeed = target?.initialRecord || getCachedEditRecord(billType, billId) || null\n  const [activeTab, setActiveTab] = useState('overview')\n  const [record, setRecord] = useState(initialSeed)\n  const [invoiceSummary, setInvoiceSummary] = useState(() => peekBill360Resource(`invoice:${billType}:${billId}`))\n  const [quickSdkRows, setQuickSdkRows] = useState([])\n  const [contracts, setContracts] = useState([])\n  const [attachments, setAttachments] = useState([])\n  const [payments, setPayments] = useState([])\n  const [bankInstruction, setBankInstruction] = useState(null)\n  const [bankAttachments, setBankAttachments] = useState([])\n  const [loading, setLoading] = useState(!initialSeed)\n  const [invoiceLoading, setInvoiceLoading] = useState(!invoiceSummary)\n  const [contractsLoading, setContractsLoading] = useState(false)\n  const [quickSdkLoading, setQuickSdkLoading] = useState(false)\n  const [quickSdkLoaded, setQuickSdkLoaded] = useState(false)\n  const [paymentsLoading, setPaymentsLoading] = useState(false)\n  const [paymentsLoaded, setPaymentsLoaded] = useState(false)\n  const [attachmentsLoading, setAttachmentsLoading] = useState(false)\n  const [attachmentsLoaded, setAttachmentsLoaded] = useState(false)\n  const [error, setError] = useState('')\n",
              'bill360 state split'
          )

          start = "  useEffect(() => {\n    if (!billId) return undefined\n    let cancelled = false\n    setLoading(true)\n    setError('')\n"
          end = "  useEffect(() => {\n    const handleKeyDown = (event) => {"
          progressive = r'''  useEffect(() => {
    if (!billId) return undefined
    let cancelled = false
    const seeded = target?.initialRecord || getCachedEditRecord(billType, billId) || null
    setRecord(seeded)
    setLoading(!seeded)
    setError('')
    setQuickSdkRows([])
    setQuickSdkLoaded(false)
    setPayments([])
    setBankInstruction(null)
    setPaymentsLoaded(false)
    setAttachments([])
    setBankAttachments([])
    setAttachmentsLoaded(false)

    void loadEditRecord(
      billType,
      billId,
      async () => billType === 'rd'
        ? apiRowToFrontend(await getReconciliationRecord(billId))
        : apiChannelRowToFrontend(await getChannelRecord(billId))
    )
      .then((apiRecord) => {
        if (!cancelled) setRecord(apiRecord)
      })
      .catch((loadError) => {
        if (!cancelled && !seeded) setError(loadErrorLabel(loadError))
      })
      .finally(() => {
        if (!cancelled) setLoading(false)
      })

    return () => {
      cancelled = true
    }
  }, [billId, billType, target?.initialRecord])

  useEffect(() => {
    if (!billId) return undefined
    let cancelled = false
    const key = `invoice:${billType}:${billId}`
    const cached = peekBill360Resource(key)
    setInvoiceSummary(cached)
    setInvoiceLoading(!cached)
    void loadBill360Resource(key, () => getBillInvoiceSummary(billType, billId), { ttlMs: 60_000 })
      .then((result) => {
        if (!cancelled) setInvoiceSummary(result)
      })
      .catch(() => {
        if (!cancelled) setInvoiceSummary(null)
      })
      .finally(() => {
        if (!cancelled) setInvoiceLoading(false)
      })
    return () => {
      cancelled = true
    }
  }, [billId, billType])

  useEffect(() => {
    if (!billId || !record) return undefined
    let cancelled = false
    const name = bill360PartnerName(billType, record)
    const partnerId = String(record?.partnerId || '')
    if (!name && !partnerId) {
      setContracts([])
      setContractsLoading(false)
      return undefined
    }
    const cacheKey = `contracts:${partnerId || name.toLowerCase()}`
    const cached = peekBill360Resource(cacheKey)
    if (cached) setContracts(cached)

    const run = () => {
      if (!cached) setContractsLoading(true)
      void loadBill360Resource(
        cacheKey,
        () => listContracts({ q: name, limit: 100, offset: 0 })
          .then((response) => filterBill360Contracts(response.items || [], name, partnerId)),
        { ttlMs: 90_000 }
      )
        .then((result) => {
          if (!cancelled) setContracts(result || [])
        })
        .catch(() => {
          if (!cancelled && !cached) setContracts([])
        })
        .finally(() => {
          if (!cancelled) setContractsLoading(false)
        })
    }

    if (activeTab === 'contract') {
      run()
      return () => { cancelled = true }
    }
    const cancelIdle = scheduleBill360Idle(run, 650)
    return () => {
      cancelled = true
      cancelIdle()
    }
  }, [activeTab, billId, billType, record])

  useEffect(() => {
    if (!billId || billType !== 'rd' || !record || quickSdkLoaded) return undefined
    const quickKeys = bill360QuickSdkKeys(billType, record).slice(0, 40)
    if (!quickKeys.length) {
      setQuickSdkLoaded(true)
      return undefined
    }
    let cancelled = false
    const run = () => {
      setQuickSdkLoading(true)
      void getBill360QuickSdkSummary(
        quickKeys.map((item) => ({
          key: item.key,
          settlement_month: item.month,
          game_name: item.game
        }))
      )
        .then((rows) => {
          if (cancelled) return
          setQuickSdkRows((rows || []).map((row) => ({
            ...row,
            lookupKey: row.key,
            lookupGame: row.game_name,
            lookupMonth: row.settlement_month
          })))
          setQuickSdkLoaded(true)
        })
        .catch(() => {
          if (!cancelled) {
            setQuickSdkRows([])
            setQuickSdkLoaded(true)
          }
        })
        .finally(() => {
          if (!cancelled) setQuickSdkLoading(false)
        })
    }

    if (activeTab === 'lines') {
      run()
      return () => { cancelled = true }
    }
    const cancelIdle = scheduleBill360Idle(run, 1_100)
    return () => {
      cancelled = true
      cancelIdle()
    }
  }, [activeTab, billId, billType, quickSdkLoaded, record])

  useEffect(() => {
    if (activeTab !== 'payment' || !billId || paymentsLoaded) return undefined
    let cancelled = false
    setPaymentsLoading(true)
    const key = `payments:${billType}:${billId}`
    const loader = async () => {
      if (billType === 'rd') {
        const [linked, instruction] = await Promise.all([
          listReconciliationLinkedBankPayments(billId).catch(() => ({ items: [] })),
          getReconciliationBankPayment(billId).catch(() => null)
        ])
        return { items: linked?.items || [], instruction }
      }
      const result = await listChannelReceipts(billId).catch(() => ({ items: [] }))
      return { items: result?.items || [], instruction: null }
    }
    void loadBill360Resource(key, loader, { ttlMs: 45_000 })
      .then((result) => {
        if (cancelled) return
        setPayments(result?.items || [])
        setBankInstruction(result?.instruction || null)
        setPaymentsLoaded(true)
      })
      .catch(() => {
        if (!cancelled) setPaymentsLoaded(true)
      })
      .finally(() => {
        if (!cancelled) setPaymentsLoading(false)
      })
    return () => { cancelled = true }
  }, [activeTab, billId, billType, paymentsLoaded])

  useEffect(() => {
    if (activeTab !== 'attachment' || !billId || attachmentsLoaded) return undefined
    let cancelled = false
    setAttachmentsLoading(true)
    const key = `attachments:${billType}:${billId}`
    const loader = async () => {
      const [billFiles, bankFiles] = await Promise.all([
        listBillAttachments(billType, billId).catch(() => []),
        billType === 'rd'
          ? listBankPaymentAttachments(billId).then((result) => result?.items || []).catch(() => [])
          : Promise.resolve([])
      ])
      return { billFiles, bankFiles }
    }
    void loadBill360Resource(key, loader, { ttlMs: 90_000 })
      .then((result) => {
        if (cancelled) return
        setAttachments(result?.billFiles || [])
        setBankAttachments(result?.bankFiles || [])
        setAttachmentsLoaded(true)
      })
      .catch(() => {
        if (!cancelled) setAttachmentsLoaded(true)
      })
      .finally(() => {
        if (!cancelled) setAttachmentsLoading(false)
      })
    return () => { cancelled = true }
  }, [activeTab, attachmentsLoaded, billId, billType])

'''
