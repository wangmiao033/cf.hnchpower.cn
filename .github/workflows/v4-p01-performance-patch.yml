              "                      {summary.flowMatched == null ? (quickSdkLoading ? '核对中…' : quickSdkLoaded ? '暂无结果' : '后台核对') : summary.flowMatched ? '流水一致' : `差异 ${money(summary.flowDifference)}`}\n                    </strong>\n                    <small>{quickSdkLoaded ? `QuickSDK ${money(summary.databaseFlow)}` : '不阻塞首屏 · 后台批量汇总'}</small>",
              'quicksdk KPI progressive text'
          )
          replace_once(
              'src/components/reconciliation/Bill360DrawerBase.jsx',
              "                    <strong>{contracts.some((item) => item.timeline_status === '生效中') ? '合同有效' : contracts.length ? '需核对' : '未匹配'}</strong>\n                    <small>匹配 {contracts.length} 份合同</small>",
              "                    <strong>{contractsLoading && !contracts.length ? '读取中…' : contracts.some((item) => item.timeline_status === '生效中') ? '合同有效' : contracts.length ? '需核对' : '未匹配'}</strong>\n                    <small>{contractsLoading && !contracts.length ? '后台读取合同，不阻塞首屏' : `匹配 ${contracts.length} 份合同`}</small>",
              'contract KPI progressive text'
          )
          replace_once(
              'src/components/reconciliation/Bill360DrawerBase.jsx',
              "                  {key === 'payment' ? <em>{payments.length}</em> : null}\n                  {key === 'contract' ? <em>{contracts.length}</em> : null}\n                  {key === 'attachment' ? <em>{attachments.length + bankAttachments.length}</em> : null}",
              "                  {key === 'payment' ? <em>{paymentsLoaded ? payments.length : '·'}</em> : null}\n                  {key === 'contract' ? <em>{contractsLoading && !contracts.length ? '·' : contracts.length}</em> : null}\n                  {key === 'attachment' ? <em>{attachmentsLoaded ? attachments.length + bankAttachments.length : '·'}</em> : null}",
              'lazy tab badges'
          )
          replace_once(
              'src/components/reconciliation/Bill360DrawerBase.jsx',
              "                          <strong>{money(summary.databaseFlow)}</strong>\n                          <small>{summary.flowMatched == null ? '暂无可核对数据' : summary.flowMatched ? '与账单流水一致' : `与账单相差 ${money(summary.flowDifference)}`}</small>",
              "                          <strong>{quickSdkLoaded ? money(summary.databaseFlow) : quickSdkLoading ? '核对中…' : '后台核对'}</strong>\n                          <small>{summary.flowMatched == null ? (quickSdkLoaded ? '暂无可核对数据' : 'QuickSDK 批量汇总不会阻塞账单打开') : summary.flowMatched ? '与账单流水一致' : `与账单相差 ${money(summary.flowDifference)}`}</small>",
              'overview quicksdk progressive text'
          )
          replace_once(
              'src/components/reconciliation/Bill360DrawerBase.jsx',
              "                        <strong>{contracts.length} 份</strong>\n                        <small>{contracts.some((item) => item.timeline_status === '生效中') ? '存在生效中合同' : contracts.length ? '当前合同需核对有效期' : '未匹配合同'}</small>",
              "                        <strong>{contractsLoading && !contracts.length ? '读取中…' : `${contracts.length} 份`}</strong>\n                        <small>{contractsLoading && !contracts.length ? '后台读取，不阻塞账单打开' : contracts.some((item) => item.timeline_status === '生效中') ? '存在生效中合同' : contracts.length ? '当前合同需核对有效期' : '未匹配合同'}</small>",
              'overview contract progressive text'
