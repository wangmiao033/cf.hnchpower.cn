name: V3.1 Feature Quality

on:
  push:
    branches:
      - codex/v3.1-rd-contract-driven-entry

permissions:
  contents: read

concurrency:
  group: v31-rd-contract-entry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  contract-terms:
    name: Contract service compile and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: contract_terms/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r contract_terms/requirements.txt
          python -m pip check
      - run: python -m compileall -q contract_terms
      - name: Run all contract regression tests
        env:
          PYTHONPATH: contract_terms:.
        run: python -m unittest discover -s contract_terms -p 'test_*.py' -v
