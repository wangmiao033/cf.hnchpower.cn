<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>对账管理系统</title>
    <style>
      /*
       * Bill 360 workspace is intentionally retired from the production UI.
       * The reconciliation ledgers and edit pages already provide the same
       * operational information without an extra full-screen drawer layer.
       * Keep the underlying data flow untouched while the legacy component is
       * cleaned up separately.
       */
      .bill360-workspace-host,
      .bill360-backdrop,
      .bill360-drawer {
        display: none !important;
      }

      /* Remove the redundant 360° row action from the two bill ledgers. */
      .core-recon-page .core-recon-row-actions > button:first-child,
      .core-channel-recon-page .core-recon-row-actions > button:first-child {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
